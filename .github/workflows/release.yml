# Publishes a GitHub release when a version tag (v1.2.3) is pushed, with the notes of that
# version in CHANGELOG.md, once the tests and the audit of the dependencies pass.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Check that the tag is the version in package.json
        run: test "$TAG" = "v$(node -p "require('./package.json').version")"
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node .github/scripts/release-notes.js "$TAG" > notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
